[package]
name = "noname_studio"
version = "1.1.0"
edition = "2021"
description = "NoName Studio â€” estudio de producciÃ³n musical"

[lib]
name = "noname_studio"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "NoNameStudio"
path = "src/main.rs"

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shine-rs = "0.1.5"
image = { version = "0.25", default-features = false, features = ["png"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "aac", "isomp4", "adpcm"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.18"
midir = "0.11"

[target.'cfg(windows)'.dependencies]
clap-sys = "0.5"
libloading = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Shell"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = 3
# optimización completa entre módulos: el motor de audio corre más rápido
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2

[package.metadata.android]
package = "com.nonamestudio.app"
apk_name = "NoNameStudio"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "NoName Studio"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
# una sola pantalla de la app aunque se abra desde un archivo (no se puede tener dos motores a la vez)
launch_mode = "singleTask"

# abrir proyectos .nns desde el administrador de archivos
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [
    { scheme = "content", host = "*", mime_type = "*/*", path_pattern = '.*\\.nns' },
    { scheme = "content", host = "*", mime_type = "*/*", path_pattern = '.*\\..*\\.nns' },
    { scheme = "content", host = "*", mime_type = "*/*", path_pattern = '.*\\..*\\..*\\.nns' },
    { scheme = "file", host = "*", path_pattern = '.*\\.nns' },
    { scheme = "file", host = "*", path_pattern = '.*\\..*\\.nns' },
]

# algunos administradores (como el de MIUI) mandan el archivo sin nombre visible, solo con tipo genérico
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]
data = [{ scheme = "content", mime_type = "application/x-nonamestudio" }]

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.signing.release]
path = "android/noname-release.keystore"
keystore_password = "KiVhWCDF0C0Mg8ts5sj2Qasm"
